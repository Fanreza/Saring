<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Situs berbahaya diblokir oleh Saring</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --bg: #0c0606; --card: #160d0d; --border: #3a1a1a; --fg: #fafafa; --muted: #c4b5b5; --danger: #f87171; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; color: var(--fg);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; line-height: 1.5;
      background: radial-gradient(50rem 30rem at 50% -5rem, rgba(220, 38, 38, .28), transparent 70%), var(--bg);
    }
    main { width: 100%; max-width: 560px; }
    .icon {
      width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; margin-bottom: 24px;
      background: rgba(248, 113, 113, .12); border: 1px solid rgba(248, 113, 113, .3); color: var(--danger);
    }
    .tag { color: var(--danger); font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { font-size: 2rem; line-height: 1.12; letter-spacing: -.035em; font-weight: 650; margin: 8px 0 12px; }
    p { color: var(--muted); margin: 0; }
    .card { margin-top: 24px; padding: 20px; border-radius: 16px; background: var(--card); border: 1px solid var(--border); }
    code {
      display: block; word-break: break-all; font: .85rem ui-monospace, 'Cascadia Code', monospace; color: var(--fg);
      padding: 10px 12px; border-radius: 10px; background: rgba(0, 0, 0, .35);
    }
    .score { display: flex; align-items: baseline; gap: 8px; margin-top: 16px; }
    .score strong { font-size: 1.5rem; color: var(--danger); font-variant-numeric: tabular-nums; }
    .score span { color: var(--muted); font-size: .9rem; }
    ul { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
    li { display: flex; gap: 10px; font-size: .925rem; }
    li::before { content: ""; flex: none; width: 6px; height: 6px; margin-top: 9px; border-radius: 50%; background: var(--danger); }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 28px; }
    button { font: inherit; cursor: pointer; border-radius: 12px; min-height: 44px; }
    #back { padding: 0 22px; border: 0; background: var(--fg); color: #0c0606; font-weight: 600; }
    #back:hover { background: #fff; }
    #proceed { padding: 0 12px; border: 0; background: none; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: .9rem; }
    #proceed:hover { color: var(--fg); }
    button:focus-visible { outline: 2px solid var(--danger); outline-offset: 3px; }
    .brand { margin-top: 40px; display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; font-weight: 600; color: var(--fg); opacity: .8; }
    .brand svg { fill: #8b8ef0; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
    </div>
    <span class="tag">Diblokir Saring</span>
    <h1>Situs ini kemungkinan besar penipuan</h1>

    <div class="card">
      <code id="url"></code>
      <div class="score" id="score" hidden><strong id="pct"></strong><span>kemungkinan phishing</span></div>
      <ul id="reasons"></ul>
    </div>

    <div class="actions">
      <button id="back">Keluar dari sini</button>
      <button id="proceed">Saya paham risikonya, tetap buka</button>
    </div>
    <p class="brand"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="3" rx="1.5"/><rect x="5" y="10.5" width="14" height="3" rx="1.5"/><rect x="8.5" y="17" width="7" height="3" rx="1.5"/></svg>Saring</p>
  </main>
  <script src="warning.js"></script>
</body>
</html>
